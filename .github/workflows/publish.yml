name: publish

# A pushed v<version> tag stages that version on npm. Nothing goes live until
# a maintainer approves the staged version on npmjs.com (NPM_TOKEN is a
# stage-only token, so a plain publish would be refused).
#
# Two jobs, so the token never meets the repository's code: `test` runs the
# tests and packs the tarball with no secrets; `publish` stages that tarball
# without checking anything out.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - name: Check the tagged commit is on main
        run: |
          git init --quiet "$RUNNER_TEMP/main-history"
          cd "$RUNNER_TEMP/main-history"
          git fetch --quiet --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: tag a commit main has merged"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (want v$version)"
            exit 1
          fi
      - name: Check whether this version is already on npm
        id: registry
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@critical-labs/environment-manager@$version" version >/dev/null 2>&1; then
            echo "::notice::$version is already published; nothing to stage"
            echo published=true >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Smoke-test built CLI
        run: node dist/cli.js --help > /dev/null
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: critical-labs-environment-manager-*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: test
    if: needs.test.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Staged publishing needs Node >= 22.14 and npm >= 11.15.
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g --ignore-scripts npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: release
      - name: Check the tarball is the tag's version
        run: |
          want="critical-labs-environment-manager-${GITHUB_REF_NAME#v}.tgz"
          have="$(ls -A release)"
          if [ "$have" != "$want" ]; then
            echo "::error::the test job's tarball is $have, not $want"
            exit 1
          fi
      - name: Stage publish (a maintainer approves on npmjs.com to go live)
        run: npm stage publish "./release/critical-labs-environment-manager-${GITHUB_REF_NAME#v}.tgz" --access public --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # Release notes for this tag, generated from its Conventional Commits.
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx --no-install git-cliff --current --strip header -o "$RUNNER_TEMP/notes.md"
      - name: Create or update the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
