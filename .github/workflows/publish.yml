name: publish

# A pushed v<version> tag stages that version on npm. Nothing goes live until
# a maintainer approves the staged version on npmjs.com (NPM_TOKEN is a
# stage-only token for @critical-labs, so a plain publish would be refused).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only a commit that main has merged may be released: a v* tag on any
      # other commit stops here.
      - name: Check the tagged commit is on main
        run: |
          git init --quiet "$RUNNER_TEMP/main-history"
          cd "$RUNNER_TEMP/main-history"
          git fetch --quiet --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: tag a commit main has merged"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Staged publishing needs Node >= 22.14 and npm >= 11.15.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@^11.15.0
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (want v$version)"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke-test built CLI
        run: node dist/cli.js --help > /dev/null
      - name: Stage publish (a maintainer approves on npmjs.com to go live)
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
