name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Smoke-test built CLI
        run: node dist/cli.js --help > /dev/null

  # Every commit message must be a Conventional Commit: CHANGELOG.md is
  # generated from them. Required on main by the repository ruleset.
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint the pull request's commits
        if: github.event_name == 'pull_request'
        run: npx --no-install commitlint --from "$BASE" --to "$HEAD" --verbose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Lint the pushed commits
        if: github.event_name == 'push'
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            npx --no-install commitlint --last --verbose
          else
            npx --no-install commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
